[project]
name = "outplaylabs-arena-sdk"
version = "0.1.0"
description = "SDK for building and testing agents on OutplayLabs Arena."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ryan Zhang", email = "ryan.zhang@yale.edu" },
    { name = "Herbert Woisetschlaeger", email = "herbert@woisetschlaeger.fyi" },
]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outplaylabs_arena_sdk"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
