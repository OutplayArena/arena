[project]
name = "outplayarena-sdk"
version = "0.1.0"
description = "Python SDK for building and testing agents on OutplayArena."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ryan Zhang", email = "ryan.zhang@yale.edu" },
    { name = "Herbert Woisetschlaeger", email = "herbert@woisetschlaeger.fyi" },
]
keywords = [
    "arena",
    "outplaylabs",
    "agent",
    "llm",
    "game-theory",
    "mcp",
    "openai",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://arena.core-aix.org"
Documentation = "https://arena.core-aix.org/docs"
Repository = "https://github.com/OutplayArena/arena"
Issues = "https://github.com/OutplayArena/arena/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outplayarena_sdk"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "src/outplayarena_sdk",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
