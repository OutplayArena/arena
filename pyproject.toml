[project]
name = "blotto"
version = "0.1.0"
description = "Colonel Blotto game simulation with heuristic and LLM-powered agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ryan Zhang", email = "ryan.zhang@yale.edu" },
    { name = "Herbert Woisetschlaeger", email = "herbert@woisetschlaeger.fyi" },
]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "transformers>=4.45.0",
    "litellm>=1.50.0",
    "mcp>=1.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "kubernetes>=31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
