[project]
name = "nash_arena"
version = "0.1.0"
description = "NashArena: An open benchmarking platform for game theoretic analysis of LLM-powered agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ryan Zhang", email = "ryan.zhang@yale.edu" },
    { name = "Herbert Woisetschlaeger", email = "herbert@woisetschlaeger.fyi" },
]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "transformers>=4.45.0",
    "litellm>=1.50.0",
    "mcp>=1.0.0",
    "PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nash_arena", "legacy_blotto", "games"]
