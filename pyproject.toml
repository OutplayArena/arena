[tool.uv.workspace]
members = ["backend", "agent-sdk"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fakeredis>=2.30",
]
# regex 2026.6.28 was published to PyPI with only macOS wheels (a known
# CalVer publishing-pipeline bug in the `regex` package: see
# https://github.com/mrabarnett/mrab-regex/issues). uv resolves the
# latest version by date, picks that one, and `uv sync` then fails on
# Linux CI with "Distribution `regex==2026.6.28` ... can't be installed
# because it doesn't have a source distribution or wheel for the current
# platform". Pin to the last version with Linux wheels until upstream
# republishes multi-platform wheels. Bumped to <2026.6.30 to also
# exclude 2026.6.29 (same macOS-only bug). Safe to remove once
# regex>=2026.6.30 is out with Linux wheels.
override-dependencies = [
    "regex<2026.6.30",
]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
testpaths = ["backend/tests", "agent-sdk/tests", "games"]
markers = [
    "backend: tests for the FastAPI backend + game engines (auto-tagged by path)",
    "sdk: tests for the agent-sdk Python package (auto-tagged by path)",
    "games: tests for game engine logic (auto-tagged under games/)",
    "e2e: end-to-end tests that require a live minikube cluster (deselect with -m 'not e2e')",
]

[tool.coverage.run]
source = ["backend", "agent-sdk", "games"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
