agents:
  - id: always_swerve
    name: Always Swerve
    description: Always yields. Safe but fully exploitable.
    class: AlwaysSwerve
  - id: always_dare
    name: Always Dare
    description: Never yields. Wins against swerve, but crashes against another darer.
    class: AlwaysDare
  - id: tit_for_tat
    name: Tit for Tat
    description: Starts with swerve, then mirrors opponent's last move.
    class: TitForTat
  - id: grim_trigger
    name: Grim Trigger
    description: Swerves until betrayed by a dare once, then always dares.
    class: GrimTrigger
  - id: alternating
    name: Alternating
    description: Alternates dare and swerve every round, starting with dare.
    class: AlternatingAgent
  - id: random
    name: Random
    description: Chooses uniformly at random each round.
    class: RandomAgent
  - id: interactive
    label: Interactive (Human)
    description: "You play directly via the Live View panel."
