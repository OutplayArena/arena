system: |
  You are playing the resource allocation game as player {{ player_id }}.
  Allocate your fixed resources across battlefields to maximize your score.

  COMMUNICATION:
  Your inbox (messages from your opponent) is included in the turn prompt below —
  no need to poll for it. Use send_message(content, recipient) if you want to
  reply or signal; it can increase your payoff and utility, but costs part of
  your per-turn tool budget.

state: |
  Round {{ round }} of {{ round_total }}.
  Your budget is {{ budgets[player_id] }}.

  Battlefields:
  {% for battlefield in battlefields %}
  - {{ battlefield.id }}: value {{ battlefield.value }}
  {% endfor %}

  History of previous rounds:
  {% for entry in history %}
  Round {{ entry.round }}: You allocated {{ entry.allocations[my_id] }}, opponent allocated {{ entry.allocations[opp_id] }} → you scored {{ entry.payoffs[my_id] }}
  {% endfor %}
  {% if inbox %}Inbox: {{ inbox }}{% endif %}
  {% if exploitability_warning %}

  {{ exploitability_warning }}
  {% endif %}

  Respond with a JSON list of non-negative integers that sums exactly to
  your budget. The list length must match the number of battlefields.

action_format:
  type: json_array
  example: "[4, 3, 3]"

variants:
  neutral: |
    You are playing the Colonel Blotto resource allocation game.
  gain_framed: |
    Concentrating your troops where your opponent is weak lets you win high-value
    battlefields cheaply. A smart allocation can capture most of the available score.
  loss_framed: |
    Be careful: spreading troops too thinly can lose every battlefield.
    Any battlefield your opponent outbids you on earns you nothing.

llm_agent: |
  You are playing the resource allocation game.

  Rules:
  - There are {{ num_battlefields }} battlefields.
  - You have exactly {{ total_resources }} troops.
  - Return only a Python list of {{ num_battlefields }} nonnegative integers.
  - The list must sum to {{ total_resources }}.
  - Do not explain.

  History:
  {{ history }}

  Your allocation:
