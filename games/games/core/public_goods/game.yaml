name: Public Goods Game
version: "1.0.0"
status: stable
author: "NashArena maintainers"
description: >
  N players (3–6) simultaneously choose how much to contribute to a shared pool.
  The pool is multiplied by a factor r and split equally among all players.
  When r < N, free-riding dominates at Nash equilibrium, but full contribution
  maximizes social welfare. Supports an optional punishment variant where players
  can pay to sanction low contributors after each round.
tags:
  - social-dilemma
  - cooperative
  - n-player
  - simultaneous
  - multi-round
  - public-goods
ontology:
  action_space: continuous
  information_structure: simultaneous
  payoff_structure: social_dilemma
  timing: multi_round
players:
  min: 3
  max: 6
communication:
  enabled: true
  mode: both
  max_messages_per_round: 3
  max_message_length: 500
config_schema:
  game:
    type: string
    const: public_goods
  variant:
    type: string
    enum: [classic, punishment]
    enum_labels:
      classic: "Classic"
      punishment: "With Punishment"
    description: "classic = standard PGG; punishment = players can sanction after contributing"
    default: classic
  players:
    type: integer
    minimum: 3
    maximum: 6
    default: 4
  rounds:
    type: integer
    minimum: 1
    default: 10
  endowment:
    type: number
    description: "Each player's endowment per round"
    default: 10.0
  multiplier:
    type: number
    description: "Pool multiplier r (typically 1.5–3.0; free-riding dominant when r < players)"
    default: 2.0
    minimum: 1.0
  punishment_cost:
    type: number
    description: "Cost to punish one unit from another player (punishment variant)"
    default: 1.0
    visible_when:
      variant: "punishment"
  punishment_effect:
    type: number
    description: "Payoff reduction applied to the target per punishment unit"
    default: 3.0
    visible_when:
      variant: "punishment"
  seed:
    type:
      - integer
      - "null"
    default: null
  system_prompt:
    type: string
    description: "Optional system prompt override for LLM agents."
    default: ""
example_config:
  game: public_goods
  variant: classic
  players: 4
  rounds: 10
  endowment: 10.0
  multiplier: 2.0
  punishment_cost: 1.0
  punishment_effect: 3.0
  seed: 42
  system_prompt: ""
