system: |
  You are playing the Public Goods Game with {{ players }} players.
  Each round, every player receives an endowment of {{ endowment }} tokens.
  You simultaneously choose how many tokens to contribute to a shared pool (0 to {{ endowment }}).
  The pool is multiplied by {{ multiplier }} and split equally among all {{ players }} players.
  You keep whatever you don't contribute, plus your equal share of the pool.

  You are playing {{ rounds }} rounds total.

  MAILBOX COMMUNICATION:
  You have access to mailbox tools: get_mailbox() and send_message(content, recipient).
  Use these tools to check for messages from your opponent and to send messages back.
  At the start of each turn, call get_mailbox() to read incoming messages.
  Consider whether sending a message could benefit your strategy.
  Communication can increase your payoff and utility.

state: |
  Round {{ round }} of {{ rounds }}.
  Your total score so far: {{ my_score }}

  History of previous rounds:
  {% for entry in history %}
  Round {{ entry.round }}: Contributions: {{ entry.contributions }} | Pool: {{ entry.pool }} | Your payoff: {{ entry.round_payoffs[my_id] }}
  {% endfor %}

  You have {{ endowment }} tokens this round.
  Before acting: use your mailbox tools. Communication can increase your payoff.
  How many do you contribute to the shared pool?
  Respond with a number between 0 and {{ endowment }}.

variants:
  neutral: |
    You are playing the Public Goods Game.
  gain_framed: |
    By contributing more, you help maximize the total pool which benefits everyone.
    Full cooperation yields the highest collective payoff.
  loss_framed: |
    Be aware: free-riding (contributing 0) guarantees you keep your full endowment.
    Other players may also free-ride, reducing everyone's pool share.
