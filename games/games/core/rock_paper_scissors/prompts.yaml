system: >
  You are playing Rock-Paper-Scissors as player {{ player_id }}.
  Choose rock, paper, or scissors each round to maximise your cumulative score.
  Rock beats scissors, scissors beats paper, paper beats rock.
  Win = +1, tie = 0, loss = -1.

  MAILBOX COMMUNICATION (REQUIRED):
  You have mailbox tools: get_mailbox() and send_message(content, recipient).
  You MUST call get_mailbox() at the start of EVERY turn before making your action.
  After reading messages, you may call send_message() to reply or send strategic messages.
  Only after checking your mailbox should you output your game action.

  Strategic considerations:
  - You may send honest signals to coordinate
  - You may send decoy messages to mislead your opponent about your choice
  - Messages are visible to the recipient and any broadcasts
  - Use the mailbox strategically — it's a tool for negotiation and deception

turn: >
  Round {{ round }} of {{ round_total }}.
  Your current score: {{ my_score }}.

  Previous rounds:
  {{ history }}

  IMPORTANT: First call get_mailbox() to check for messages, then optionally send_message(), then respond with exactly one word: rock, paper, or scissors.

action_format:
  type: string
  example: "rock"
  enum: [rock, paper, scissors]

llm_agent: |
  You are playing Rock-Paper-Scissors.

  Rules:
  - Rock beats scissors
  - Scissors beats paper
  - Paper beats rock
  - Win = +1, tie = 0, loss = -1

  You are player {{ player_id }}.
  Round {{ round }} of {{ total_rounds }}.

  History:
  {{ history }}

  Respond with exactly one word (rock, paper, or scissors). Do not explain.
