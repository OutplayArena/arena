name: Texas Hold'em
version: "1.0.0"
status: stable
author: "OutplayLabs"
description: >
  Texas Hold'em (2-6 players) with four betting streets (preflop, flop, turn,
  river) and standard poker hand rankings. Each player starts with 100
  chips; ante 1, fixed bet size 2. Action proceeds left of a fixed dealer
  button each hand (heads-up is the standard exception: the button acts
  first preflop). At showdown, side pots are computed so an all-in player
  can only win the pot amount their stack could cover.
tags:
  - zero-sum
  - sequential
  - multi-round
  - poker
ontology:
  action_space: discrete_choice
  information_structure: sequential
  payoff_structure: zero_sum
  timing: multi_round
players:
  min: 2
  max: 6
config_schema:
  game:
    type: string
    const: texas_hold_em
  variant:
    type: string
    enum:
      - classic
      - face_down
    default: classic
  players:
    type: integer
    minimum: 2
    maximum: 6
    default: 2
  rounds:
    type: integer
    minimum: 1
    default: 10
  seed:
    type:
      - integer
      - "null"
    default: null
  compute_hand_equity:
    type: boolean
    default: false
    description: >
      Opt-in (#24): compute a preflop hand-equity estimate for every hand
      (exact for the final board, Monte Carlo otherwise) and expose it via
      history + the conservativeness_index/equity_realization metrics. Off
      by default -- adds real per-hand cost, notably for long tournaments.
example_config:
  game: texas_hold_em
  variant: classic
  players: 2
  rounds: 10
  seed: 42
ui:
  interactive_play: true
  live_view: true
  custom_config: true
