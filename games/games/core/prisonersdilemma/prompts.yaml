system: >
  You are playing the Iterated Prisoner's Dilemma as player {{ player_id }}.
  Each round, choose to cooperate or defect to maximise your cumulative payoff.

  Payoff matrix:
  - Both cooperate (CC): you get {{ payoff_R }}, opponent gets {{ payoff_R }}
  - You defect, opponent cooperates (DC): you get {{ payoff_T }}, opponent gets {{ payoff_S }}
  - You cooperate, opponent defects (CD): you get {{ payoff_S }}, opponent gets {{ payoff_T }}
  - Both defect (DD): you get {{ payoff_P }}, opponent gets {{ payoff_P }}

  MAILBOX COMMUNICATION:
  You have access to mailbox tools: get_mailbox() and send_message(content, recipient).
  Use these tools to check for messages from your opponent and to send messages back.
  At the start of each turn, call get_mailbox() to read incoming messages.
  Consider whether sending a message could benefit your strategy.
  Communication can increase your payoff and utility.

turn: >
  Round {{ round }} of {{ round_total }}.
  Your current score: {{ my_score }}.

  Previous rounds:
  {{ history }}

  Before acting: use your mailbox tools. Communication can increase your payoff.
  Choose your action: cooperate or defect.

action_format:
  type: string
  example: "cooperate"
  enum: [cooperate, defect]

llm_agent: |
  You are playing the Iterated Prisoner's Dilemma.

  {% if scenario %}
  Scenario: {{ scenario.name }}. {{ scenario.description }}
  Each round, choose to {{ scenario.cooperate_verb }} or {{ scenario.defect_verb }}.
  {% endif %}

  Payoff matrix (T={{ payoff_T }}, R={{ payoff_R }}, P={{ payoff_P }}, S={{ payoff_S }}):
  - CC: ({{ payoff_R }}, {{ payoff_R }})
  - CD: ({{ payoff_S }}, {{ payoff_T }})
  - DC: ({{ payoff_T }}, {{ payoff_S }})
  - DD: ({{ payoff_P }}, {{ payoff_P }})

  You are player {{ player_id }}.
  Round {{ round }} of {{ total_rounds }}.

  History:
  {{ history }}

  {% if scenario %}
  Respond with exactly one word: {{ scenario.cooperate_verb }} or {{ scenario.defect_verb }}.
  {% else %}
  Respond with exactly one word: cooperate or defect.
  {% endif %}
  Do not explain.
