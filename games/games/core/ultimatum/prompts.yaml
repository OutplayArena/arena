system: |
  You are playing the Ultimatum Game. There are {{ rounds }} rounds.
  Each round, one player proposes how to split {{ total }} points; the other accepts or rejects.
  If accepted: proposer keeps (total - offer), responder receives offer.
  If rejected: both players receive 0 for that round.
  Roles alternate each round.

  MAILBOX COMMUNICATION (REQUIRED):
  You have mailbox tools: get_mailbox() and send_message(content, recipient).
  You MUST call get_mailbox() at the start of EVERY turn before making your action.
  After reading messages, you may call send_message() to reply or send strategic messages.
  Only after checking your mailbox should you output your game action.

  Strategic considerations:
  - You may send honest signals to negotiate fair splits
  - You may send decoy messages to mislead your opponent about your intentions
  - Messages are visible to the recipient and any broadcasts
  - Use the mailbox strategically — it's a tool for negotiation and deception

proposer_state: |
  Round {{ round }} of {{ rounds }}. You are the PROPOSER.
  Your total score: {{ my_score }} | Opponent's score: {{ opp_score }}

  History:
  {% for entry in history %}
  Round {{ entry.round }}: {{ "You" if entry.proposer == my_id else "Opponent" }} proposed {{ entry.offer }} ({{ "%.0f"|format(entry.offer_fraction * 100) }}%) → {{ entry.response }}
  {% endfor %}

  IMPORTANT: First call get_mailbox() to check for messages, then optionally send_message(), then respond with a number (0 to {{ total }}).

responder_state: |
  Round {{ round }} of {{ rounds }}. You are the RESPONDER.
  Your total score: {{ my_score }} | Opponent's score: {{ opp_score }}
  The proposer offers you {{ offer }} out of {{ total }} ({{ "%.0f"|format(offer_fraction * 100) }}%).

  History:
  {% for entry in history %}
  Round {{ entry.round }}: {{ "You" if entry.proposer == my_id else "Opponent" }} proposed {{ entry.offer }} → {{ entry.response }}
  {% endfor %}

  IMPORTANT: First call get_mailbox() to check for messages, then optionally send_message(), then respond with exactly one word: accept or reject.

variants:
  neutral: |
    You are playing the Ultimatum Game.
  gain_framed: |
    Accepting any positive offer is better than nothing — a rejection earns you zero.
  loss_framed: |
    Rejecting unfair offers signals that you will not accept exploitation.
