[project]
name = "games"
version = "0.1.0"
description = "Game implementations for OutplayLabs Arena"
requires-python = ">=3.10"
dependencies = [
    "outplaylabs-arena-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["games"]

[tool.uv.sources]
outplaylabs-arena-sdk = { path = "../agent-sdk", editable = true }
