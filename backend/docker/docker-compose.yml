services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - nasharena_mcp
    labels:
      - "traefik.enable=true"

      # Dashboard: agent-arena.local
      - "traefik.http.routers.dashboard.rule=Host(`agent-arena.local`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nasharena
      POSTGRES_PASSWORD: nasharena
      POSTGRES_DB: nasharena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasharena"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    command:
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: postgresql://nasharena:nasharena@db:5432/nasharena
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://nasharena:nasharena@db:5432/nasharena
      REDIS_URL: redis://redis:6379/0
      API_PREFIX: /api
      OAUTH_CALLBACK_BASE_URL: http://localhost:8000
      ENABLE_AGENT_REST_API: "true"
      MCP_BACKEND_URL: http://backend:8000/api
      MCP_DOCKER_NETWORK: nasharena_mcp
      MCP_ALLOWED_IPS: 127.0.0.1,backend
      MCP_EXPOSE_PORTS: "true"
      # MCP_PUBLIC_BASE_URL: http://localhost  # Uncomment when traefik is working
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - nasharena_mcp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nasharena.loadbalancer.server.port=8000"

      # HTTP -> HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # API: api.agent-arena.local (HTTPS)
      - "traefik.http.routers.nasharena.rule=Host(`api.agent-arena.local`)"
      - "traefik.http.routers.nasharena.entrypoints=websecure"
      - "traefik.http.routers.nasharena.tls=true"

      # API: localhost (HTTP, no redirect for testing)
      - "traefik.http.routers.nasharena-local.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.nasharena-local.entrypoints=web"
      - "traefik.http.routers.nasharena-local.service=nasharena"

volumes:
  pgdata:
  redisdata:

networks:
  nasharena_mcp:
    name: nasharena_mcp
    driver: bridge
