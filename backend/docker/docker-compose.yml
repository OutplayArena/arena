services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"

      # Dashboard: agent-arena.local
      - "traefik.http.routers.dashboard.rule=Host(`agent-arena.local`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outplayarena
      POSTGRES_PASSWORD: outplayarena
      POSTGRES_DB: outplayarena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outplayarena"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    command:
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: postgresql://outplayarena:outplayarena@db:5432/outplayarena
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://outplayarena:outplayarena@db:5432/outplayarena
      REDIS_URL: redis://redis:6379/0
      API_PREFIX: /api
      OAUTH_CALLBACK_BASE_URL: http://localhost:8000
      ENABLE_AGENT_REST_API: "true"
      MCP_ENDPOINT: "${MCP_PUBLIC_URL:-http://localhost}/mcp"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.arena.loadbalancer.server.port=8000"

      # HTTP -> HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # API: api.agent-arena.local (HTTPS)
      - "traefik.http.routers.arena.rule=Host(`api.agent-arena.local`)"
      - "traefik.http.routers.arena.entrypoints=websecure"
      - "traefik.http.routers.arena.tls=true"

      # API: localhost (HTTP, no redirect for testing)
      - "traefik.http.routers.arena-local.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.arena-local.entrypoints=web"
      - "traefik.http.routers.arena-local.service=arena"

  mcp:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile.mcp
    environment:
      OUTPLAYARENA_BASE_URL: http://backend:8000/api
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
    depends_on:
      backend:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.arena-mcp.loadbalancer.server.port=8000"

      # MCP: localhost (HTTP) — higher priority than the /api backend route
      - "traefik.http.routers.arena-mcp-local.rule=PathPrefix(`/mcp`)"
      - "traefik.http.routers.arena-mcp-local.entrypoints=web"
      - "traefik.http.routers.arena-mcp-local.service=arena-mcp"
      - "traefik.http.routers.arena-mcp-local.priority=200"

      # MCP: api.agent-arena.local (HTTPS)
      - "traefik.http.routers.arena-mcp.rule=Host(`api.agent-arena.local`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.arena-mcp.entrypoints=websecure"
      - "traefik.http.routers.arena-mcp.tls=true"
      - "traefik.http.routers.arena-mcp.service=arena-mcp"
      - "traefik.http.routers.arena-mcp.priority=200"

  docs:
    build:
      context: ../..
      dockerfile: docs/Dockerfile
    # Port exposed for direct access without Traefik (e.g. `docker compose up docs`)
    ports:
      - "8001:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.arena-docs.loadbalancer.server.port=80"

      # docs.agent-arena.local (HTTPS)
      - "traefik.http.routers.arena-docs.rule=Host(`docs.agent-arena.local`)"
      - "traefik.http.routers.arena-docs.entrypoints=websecure"
      - "traefik.http.routers.arena-docs.tls=true"
      - "traefik.http.routers.arena-docs.service=arena-docs"

      # docs.agent-arena.local (HTTP — redirect to HTTPS)
      - "traefik.http.routers.arena-docs-http.rule=Host(`docs.agent-arena.local`)"
      - "traefik.http.routers.arena-docs-http.entrypoints=web"
      - "traefik.http.routers.arena-docs-http.middlewares=https-redirect"

volumes:
  pgdata:
  redisdata:
