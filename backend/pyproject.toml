[project]
name = "nash_arena"
version = "0.1.0"
description = "NashArena: An open benchmarking platform for game theoretic analysis of LLM-powered agents."
readme = "../README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ryan Zhang", email = "ryan.zhang@yale.edu" },
    { name = "Herbert Woisetschlaeger", email = "herbert@woisetschlaeger.fyi" },
]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "openai>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "transformers>=4.45.0",
    "litellm>=1.50.0",
    "mcp>=1.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "kubernetes>=31.0",
    "PyYAML>=6.0.0",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "python-dotenv>=1.0",
    "itsdangerous>=2.0",
    "cryptography>=42.0.0",
    "wandb>=0.17.0",
    "jinja2>=3.1",
    "games",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nash_arena"]

[tool.uv.sources]
games = { path = "../games", editable = true }
