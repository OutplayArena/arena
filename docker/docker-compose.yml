services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"

      # Dashboard: agent-arena.local
      - "traefik.http.routers.dashboard.rule=Host(`agent-arena.local`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blotto
      POSTGRES_PASSWORD: blotto
      POSTGRES_DB: blotto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blotto"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: postgresql://blotto:blotto@db:5432/blotto
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://blotto:blotto@db:5432/blotto
      API_PREFIX: /api
      OAUTH_CALLBACK_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.blotto.loadbalancer.server.port=8000"

      # HTTP → HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # API: api.agent-arena.local (HTTPS)
      - "traefik.http.routers.blotto.rule=Host(`api.agent-arena.local`)"
      - "traefik.http.routers.blotto.entrypoints=websecure"
      - "traefik.http.routers.blotto.tls=true"

      # API: api.agent-arena.local (HTTP → HTTPS)
      - "traefik.http.routers.blotto-insecure.rule=Host(`api.agent-arena.local`)"
      - "traefik.http.routers.blotto-insecure.entrypoints=web"
      - "traefik.http.routers.blotto-insecure.middlewares=https-redirect"

volumes:
  pgdata:
