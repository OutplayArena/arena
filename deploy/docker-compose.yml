# Production docker-compose for a single Hetzner CX22 VPS.
#
# Topology:
#   Internet → Traefik (:80, :443, Let's Encrypt)
#                ├─ <DOMAIN>/          → backend (FastAPI + React SPA + mkdocs static)
#                └─ <DOMAIN>/mcp/      → mcp (single long-running MCP server)
#
# Docs are served as static files embedded in the backend image at /docs/.
# They are built by the mkdocs stage in backend/docker/Dockerfile and placed
# in backend/static/docs/ alongside the React SPA.
#
# Volumes:
#   - postgres_data   Postgres data  (backed up nightly by restic)
#   - redis_data      Redis AOF      (ephemeral; only backed up if you want)
#   - traefik_acme    Let's Encrypt certs
#
# Production runs this as a single-node Docker Swarm stack (not plain
# `docker compose`) so that `docker service update` can roll backend/mcp
# out with zero downtime — new task healthchecked and routed before the
# old one is stopped. See docs/deployment/single-vps.md for the one-time
# `docker swarm init` cutover.
#
# Run from the deploy/ directory:
#   cp .env.production.example .env
#   $EDITOR .env       # fill in DOMAIN, secrets, OAuth, etc.
#   docker swarm init  # one-time, turns this host into a 1-node swarm
#   ./scripts/stack-deploy.sh
#
# Use scripts/stack-deploy.sh, not a bare `docker stack deploy` — unlike
# `docker compose`, `docker stack deploy` does NOT auto-read .env from the
# working directory for ${VAR} interpolation (no --env-file flag either).
# Run it bare and every ${DOMAIN}/${POSTGRES_PASSWORD}/etc. below silently
# resolves to an empty string. stack-deploy.sh exports .env first, then runs it.
#
# The two arena images (backend, mcp) are pulled from Docker Hub
# (her3ert/outplayarena-*). Override the tag with IMAGE_TAG (defaults to
# the current release). The compose uses both `build:` (so `docker
# compose build` still works for local dev, where `deploy:` keys are
# ignored) and `image:` (so `docker stack deploy`/`docker compose pull`
# fetch from Docker Hub).
#
# To cut a new release, push a tag like v0.3.0; .github/workflows/release.yml
# builds+pushes the images and then rolls this stack via
# deploy/scripts/swarm-deploy.sh over SSH. To roll manually:
#
#   docker service update --image her3ert/outplayarena-backend:<tag> --with-registry-auth arena_backend
#   docker service update --image her3ert/outplayarena-mcp:<tag>     --with-registry-auth arena_mcp

# YAML anchor: cap container logs at 3×10MB (rotated by Docker).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    # Pin to a recent v3 minor that supports Docker API >=1.40. The v3.3
    # tag predates that and the provider fails with "client version
    # 1.24 is too old". Bump on minor releases as needed.
    image: traefik:v3.7
    environment:
      # The Traefik Docker provider hardcodes an old API version;
      # modern Docker daemons (>=29.x) reject it. Pin the version
      # explicitly so the provider can talk to the socket.
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.55}
      DOCKER_PROVIDER_API_VERSION: ${DOCKER_API_VERSION:-1.55}
      TRAEFIK_LOG_LEVEL: DEBUG
    volumes:
      # Dynamic config (e.g. the stripPrefix middleware for /docs)
      - ./dynamic:/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    command:
      # Traefik v3 split swarm-mode routing out of the Docker provider into
      # a dedicated Swarm provider — `--providers.docker.swarmMode=true` was
      # removed (fails fast with "incompatible deprecated install
      # configuration option found"). Use --providers.swarm.* instead.
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=arena_default
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.traefik.address=:8080
      - --api.insecure=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --accesslog=true
      - --accesslog.fields.headers.names.User-Agent=keep
      - --log.level=INFO
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        # Dashboard at traefik.<DOMAIN> with basic auth
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
        - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outplayarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-outplayarena}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outplayarena} -d ${POSTGRES_DB:-outplayarena}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  backend:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile
    image: her3ert/outplayarena-backend:${IMAGE_TAG:-v0.2.1}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-outplayarena}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-outplayarena}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_PREFIX: /api
      ENABLE_AGENT_REST_API: "true"
      OAUTH_CALLBACK_BASE_URL: https://${DOMAIN}
      OAUTH_ALLOWED_BASES: https://${DOMAIN}
      MCP_ENDPOINT: https://${DOMAIN}/mcp
      CORS_ALLOW_ORIGINS: https://${DOMAIN}
    # `docker stack deploy` parses Compose files with Swarm's own (more
    # limited) interpreter, which rejects the long-form `depends_on:
    # { condition: ... }` map syntax — only a plain list is valid here.
    # Swarm doesn't act on depends_on either way (no service-health
    # gating); restart_policy below handles the brief crash-loop until
    # postgres/redis are ready on first stack bring-up.
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    stop_grace_period: 30s   # let in-flight API requests finish before SIGKILL
    deploy:
      replicas: 1
      update_config:
        order: start-first   # new task must pass its healthcheck before the old one stops
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.arena-backend.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.arena-backend.entrypoints=websecure"
        - "traefik.http.routers.arena-backend.tls=true"
        - "traefik.http.routers.arena-backend.tls.certresolver=letsencrypt"
        - "traefik.http.routers.arena-backend.service=arena-backend"
        - "traefik.http.services.arena-backend.loadbalancer.server.port=8000"
        - "traefik.http.services.arena-backend.loadbalancer.healthcheck.path=/api/health"

  mcp:
    # Single long-running MCP server. The backend tells SDK clients to
    # connect to https://${DOMAIN}/mcp via MCP_ENDPOINT; Traefik routes
    # that path to this container.
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.mcp
    image: her3ert/outplayarena-mcp:${IMAGE_TAG:-v0.2.1}
    env_file: .env
    environment:
      OUTPLAYARENA_BASE_URL: http://backend:8000/api
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8001"
      MCP_ALLOWED_HOSTS: ${DOMAIN}
      MCP_ALLOWED_ORIGINS: https://${DOMAIN}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    # In-flight MCP connections (multi-turn LLM matches) on the old task
    # aren't migrated — they're cut when it stops. Give them a generous
    # grace window to finish their current turn before that happens.
    stop_grace_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.arena-mcp.rule=Host(`${DOMAIN}`) && PathPrefix(`/mcp`)"
        - "traefik.http.routers.arena-mcp.entrypoints=websecure"
        - "traefik.http.routers.arena-mcp.tls=true"
        - "traefik.http.routers.arena-mcp.tls.certresolver=letsencrypt"
        - "traefik.http.routers.arena-mcp.service=arena-mcp"
        - "traefik.http.services.arena-mcp.loadbalancer.server.port=8001"
        - "traefik.http.services.arena-mcp.loadbalancer.healthcheck.path=/health"

volumes:
  postgres_data:
  redis_data:
  traefik_acme:
