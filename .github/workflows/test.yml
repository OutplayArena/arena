name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outplaylabs-arena
          POSTGRES_PASSWORD: outplaylabs-arena
          POSTGRES_DB: outplaylabs-arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for static asset tests)
        run: cd frontend && npm ci && npm run build

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run backend tests
        # -m "backend and not e2e": backend/tests/ + games/ (game engines used by
        # backend), excluding e2e tests that need a live minikube cluster.
        # Auto-tagged by conftest.py based on file path.
        run: uv run pytest -m "backend and not e2e"
        env:
          DATABASE_URL: postgresql+asyncpg://outplaylabs-arena:outplaylabs-arena@localhost:5432/outplaylabs-arena_test
          SECRET_KEY: test-secret-key-for-ci
          PYTHONUNBUFFERED: 1

  sdk:
    name: SDK (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run SDK tests
        # -m sdk: agent-sdk/tests/ only. e2e is implicitly excluded by the
        # default addopts ("-m 'not e2e'") since we don't override the marker.
        run: uv run pytest -m sdk
        env:
          PYTHONUNBUFFERED: 1
