name: Test Suite

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v6.1.0
        id: nm-cache
        with:
          path: frontend/node_modules
          key: node-modules-${{ hashFiles('frontend/package-lock.json') }}

      - run: npm ci
        if: steps.nm-cache.outputs.cache-hit != 'true'

      - uses: actions/cache@v6.1.0
        with:
          path: frontend/.eslintcache
          key: eslint-${{ hashFiles('frontend/eslint.config.js', 'frontend/package-lock.json') }}
          restore-keys: eslint-

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint -- --cache

      - name: Test
        run: npm test

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outplayarena
          POSTGRES_PASSWORD: outplayarena
          POSTGRES_DB: outplayarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for static asset tests)
        run: cd frontend && npm ci && npm run build

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run backend tests
        # -m "backend and not e2e": backend/tests/ + games/ (game engines used by
        # backend), excluding e2e tests that need a live minikube cluster.
        # Auto-tagged by conftest.py based on file path.
        # --cov --cov-report=xml: produce coverage.xml for Codecov upload.
        run: uv run pytest -m "backend and not e2e" --cov --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://outplayarena:outplayarena@localhost:5432/outplayarena_test
          SECRET_KEY: test-secret-key-for-ci
          PYTHONUNBUFFERED: 1

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  sdk:
    name: SDK (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run SDK tests
        # -m sdk: agent-sdk/tests/ only. e2e is implicitly excluded by the
        # default addopts ("-m 'not e2e'") since we don't override the marker.
        # --cov --cov-report=xml: produce coverage.xml so the SDK job's coverage
        # is merged with the backend job's by Codecov. The backend job covers
        # backend/ + games/; the SDK job covers agent-sdk/. Without this upload
        # the SDK code reads as 0% in the merged report.
        run: uv run pytest -m sdk --cov --cov-report=xml
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
