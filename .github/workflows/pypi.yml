name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      repository:
        description: "PyPI repository to publish to"
        type: choice
        required: true
        default: testpypi
        options:
          - pypi
          - testpypi

jobs:
  publish:
    name: Build & publish outplayarena-sdk
    runs-on: ubuntu-latest
    environment:
      # The 'pypi' GitHub environment gates real-PyPI publishes — push a
      # tag, then a maintainer approves the deployment run. The token
      # below is the 'pypi' environment's PYPI_API_TOKEN.
      name: pypi
      url: https://pypi.org/p/outplayarena-sdk
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs needs full history to derive the version from the
          # nearest v*.*.* tag (the trigger of this workflow).
          fetch-depth: 0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify built artefacts
        run: |
          ls -lh dist/
          python -m pip install --quiet twine
          python -m twine check dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The build step produced artefacts in `agent-sdk/dist/`. The
          # action's `packages-dir` defaults to `dist/` relative to
          # `GITHUB_WORKSPACE` (the repo root) and does NOT honour the
          # workflow's `defaults.run.working-directory`, so the path is
          # explicit here.
          packages-dir: agent-sdk/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agent-sdk/dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.PYPI_TESTPYPI_TOKEN }}

      - name: Publish to PyPI (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agent-sdk/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
