name: Publish SDK to TestPyPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    name: Build & publish outplayarena-sdk to TestPyPI
    runs-on: ubuntu-latest
    # The 'pypi-test' environment is configured with no required reviewers,
    # so this workflow is fully automatic on every push to main and every
    # PR — no manual approval needed for staging. The PYPI_TESTPYPI_TOKEN
    # secret is scoped to this environment only.
    environment: pypi-test
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs walks the git log to derive the version, so the
          # checkout needs full history (not the default shallow clone).
          fetch-depth: 0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build hatchling hatch-vcs

      - name: Pin a collision-free dev version
        # hatch-vcs derives the version purely from commit-distance since
        # the last tag (local_scheme = "no-local-version" in pyproject.toml,
        # chosen because TestPyPI/PyPI reject uploads carrying a local
        # version segment like "+g1a2b3c4"). That means any two branches or
        # concurrent runs at the same distance-from-tag compute an
        # identical version and collide on TestPyPI's immutable file names
        # ("400 File already exists"). This only affects this *test*
        # workflow — real releases go through pypi.yml, which is keyed off
        # an actual git tag and never sets this override — so it's safe to
        # replace the dev-count with this run's globally-unique run_id,
        # guaranteeing every push/PR build gets its own version.
        run: |
          BASE=$(python -m hatchling version)
          CORE=$(python -c "import re,sys; print(re.sub(r'\.dev\d+$', '', sys.argv[1]))" "$BASE")
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${CORE}.dev${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify built artefacts
        run: |
          ls -lh dist/
          python -m pip install --quiet twine
          python -m twine check dist/*

      - name: Publish to TestPyPI
        # PRs from a fork never receive repo/environment secrets or an
        # OIDC token (GitHub withholds both from fork-triggered
        # `pull_request` runs as a security measure, even with
        # `id-token: write` set), so this step would otherwise fail every
        # time on an external contributor's PR ("Trusted publishing
        # exchange failure"). Skip it there instead of failing — the build
        # + twine-check steps above already validate the package for
        # everyone; only the actual upload needs same-repo trust.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The build step produced artefacts in `agent-sdk/dist/`. The
          # action's `packages-dir` defaults to `dist/` relative to
          # `GITHUB_WORKSPACE` (the repo root) and does NOT honour the
          # workflow's `defaults.run.working-directory`, so the path is
          # explicit here.
          packages-dir: agent-sdk/dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.PYPI_TESTPYPI_TOKEN }}

      - name: Note skipped publish (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Skipping TestPyPI publish — this PR is from a fork (${{ github.event.pull_request.head.repo.full_name }}), which GitHub never grants secrets or OIDC tokens for pull_request-triggered runs. The build + twine-check steps above already validated the package."
