name: Publish SDK to TestPyPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    name: Build & publish outplayarena-sdk to TestPyPI
    runs-on: ubuntu-latest
    # The 'pypi-test' environment is configured with no required reviewers,
    # so this workflow is fully automatic on every push to main and every
    # PR — no manual approval needed for staging. The PYPI_TESTPYPI_TOKEN
    # secret is scoped to this environment only.
    environment: pypi-test
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs walks the git log to derive the version, so the
          # checkout needs full history (not the default shallow clone).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        # The version is derived from the nearest v*.*.* git tag via
        # hatch-vcs. PR builds get a dev-version suffix like
        # ``0.1.1.dev5+g1a2b3c4`` so each commit is uniquely identifiable.
        run: python -m build

      - name: Verify built artefacts
        run: |
          ls -lh dist/
          python -m pip install --quiet twine
          python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.PYPI_TESTPYPI_TOKEN }}
