nameOverride: ""
fullnameOverride: ""

dev:
  liveReload: false
  staticSourcePath: /home/herbert/shared/code/arena/backend/static

database:
  image: postgres:16-alpine
  database: outplayarena
  user: outplayarena
  password: outplayarena
  storage: 10Gi
  storageClassName: ""
  # When true, the chart renders a static PersistentVolume
  # (templates/database/persistentvolume.yaml) with reclaimPolicy: Retain and
  # a hostPath at /data/outplayarena-postgres. The StatefulSet's
  # volumeClaimTemplates PVC then binds to this PV by name (see
  # statefulset.yaml). Because the PV is NOT tracked by Helm, `helm uninstall`
  # leaves it intact — the next `helm install` re-binds the same PV and your
  # database survives teardowns. On minikube the hostPath lives inside the
  # minikube container/VM: it survives `helm uninstall` and `minikube stop`,
  # but is wiped by `minikube delete`. Set to false to fall back to the
  # cluster's default StorageClass (e.g. minikube's standard, which has
  # reclaimPolicy: Delete — your DB will be wiped on `helm uninstall`).
  createPV: true
  # Name of the static PV. When empty, the chart defaults to
  # "<fullname>-db-pv". Set this explicitly only if you need to share a PV
  # across releases or pin to a pre-existing PV.
  volumeName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  image: redis:7-alpine
  port: 6379
  storage: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

oauth:
  # OAuth callback base URL. Set this in .env (OAUTH_CALLBACK_BASE_URL) or pass
  # via --set on the helm command — the helm-upgrade.sh script computes it
  # from `minikube ip` and the backend NodePort automatically. Leave empty
  # here so a stale value never ships.
  callbackBaseUrl: ""
  githubClientId: ""
  githubClientSecret: ""
  googleClientId: ""
  googleClientSecret: ""
  jwtSecret: "098991b0b02fbd9e54a89aa7eac3bbad864487a4234cb5eadf6bb3a207b8eb15"

backend:
  image:
    # Default points at the Docker Hub canonical name (matches the production
    # images published by .github/workflows/release.yml). helm-upgrade.sh
    # passes --set backend.image.repository=arena-backend in --build mode to
    # override this to the locally-built tag.
    repository: her3ert/outplayarena-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    apiPrefix: /api
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

mcpServer:
  image:
    # See backend.image.repository note above.
    repository: her3ert/outplayarena-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 9999
  replicas: 2
  publicBaseUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

migrations:
  image:
    # Migrations reuse the backend image. helm-upgrade.sh overrides the
    # repository to arena-backend in --build mode (same as backend).
    repository: her3ert/outplayarena-backend
    tag: latest
    pullPolicy: IfNotPresent

docs:
  # The docs image is NOT published to a registry — it's built locally from
  # docs/Dockerfile by helm-upgrade.sh in both --build and --pull modes.
  image:
    repository: arena-docs
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

traefik:
  # When true, the chart renders the Traefik IngressRoute + Middleware
  # resources (helm/arena/templates/traefik/* and the per-component
  # ingressroute.yaml files). The CRDs (traefik.io/v1alpha1) must be
  # installed in the cluster — typically by running the script with
  # --with-traefik so it installs the Traefik controller chart, which
  # brings the CRDs with it. Off by default; the recommended way to
  # expose local services is `kubectl port-forward` via
  # scripts/dev-tunnel.sh.
  enabled: false
  host: agent-arena.local
  certResolver: ""
  middleware:
    rateLimit:
      average: 5000
      burst: 1000
