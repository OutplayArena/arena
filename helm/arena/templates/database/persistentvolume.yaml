{{- if .Values.database.createPV -}}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.database.volumeName | default (printf "%s-db-pv" (include "arena.fullname" .)) }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  capacity:
    storage: {{ .Values.database.storage }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.database.storageClassName | quote }}  # explicit ("") bypasses default-class admission on the PVC so it binds to this static PV by name
  hostPath:
    path: /data/outplayarena-postgres
    type: DirectoryOrCreate
{{- end }}
