apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blotto.fullname" . }}-backend
  labels:
    {{- include "blotto.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "blotto.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blotto.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "blotto.fullname" . }}-backend
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "blotto.fullname" . }}-backend
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ include "blotto.fullname" . }}-db:5432/{{ .Values.database.database }}"
            - name: OAUTH_CALLBACK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-oauth
                  key: callback-base-url
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-oauth
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-oauth
                  key: github-client-secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-oauth
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-oauth
                  key: google-client-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-oauth
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.env.apiPrefix }}/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.env.apiPrefix }}/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- if .Values.dev.liveReload }}
          volumeMounts:
            - name: static-files
              mountPath: /app/static
{{- end }}
{{- if .Values.dev.liveReload }}
      volumes:
        - name: static-files
          hostPath:
            path: {{ .Values.dev.staticSourcePath | quote }}
            type: Directory
{{- end }}
