apiVersion: v1
kind: Service
metadata:
  name: {{ include "nasharena.fullname" . }}-db
  labels:
    {{- include "nasharena.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "nasharena.database.selectorLabels" . | nindent 4 }}
