apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nasharena.fullname" . }}-migrations
  labels:
    {{- include "nasharena.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "nasharena.fullname" . }}-db 5432; do
                echo "waiting for database..."
                sleep 2
              done
      containers:
        - name: alembic
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nasharena.fullname" . }}-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ include "nasharena.fullname" . }}-db:5432/{{ .Values.database.database }}"
