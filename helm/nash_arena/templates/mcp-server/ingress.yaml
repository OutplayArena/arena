{{- if .Values.mcpServer.publicBaseUrl }}
# Create the StripPrefix middleware for MCP servers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-mcp-prefix
  labels:
    {{- include "nasharena.labels" . | nindent 4 }}
spec:
  stripPrefixRegex:
    regex:
      - "^/mcp/[^/]+"
{{- end }}
