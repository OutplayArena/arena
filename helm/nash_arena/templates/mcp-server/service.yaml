apiVersion: v1
kind: Service
metadata:
  name: {{ include "nasharena.fullname" . }}-mcp
  labels:
    {{- include "nasharena.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    {{- include "nasharena.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: {{ .Values.mcpServer.port }}
      targetPort: http
      protocol: TCP
