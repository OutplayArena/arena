nameOverride: ""
fullnameOverride: ""

dev:
  liveReload: false
  staticSourcePath: /home/herbert/code/blotto/backend/static

database:
  image: postgres:16-alpine
  database: nasharena
  user: nasharena
  password: nasharena
  storage: 10Gi
  storageClassName: "manual"
  volumeName: "nasharena-db-pv"
  createPV: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

oauth:
  callbackBaseUrl: "http://localhost:8000"
  githubClientId: ""
  githubClientSecret: ""
  googleClientId: ""
  googleClientSecret: ""
  jwtSecret: "change-me-in-production-use-a-long-random-string"

backend:
  image:
    repository: nasharena-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    apiPrefix: /api
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

mcpServer:
  image:
    repository: nasharena-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 8001
  maxConcurrentJobs: 50
  jobTTL: 300

migrations:
  image:
    repository: nasharena-backend
    tag: latest
    pullPolicy: IfNotPresent

traefik:
  host: agent-arena.local
  certResolver: ""
  middleware:
    rateLimit:
      average: 5000
      burst: 1000
