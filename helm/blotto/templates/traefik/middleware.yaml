apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "blotto.fullname" . }}-ratelimit
  labels:
    {{- include "blotto.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.traefik.middleware.rateLimit.average }}
    burst: {{ .Values.traefik.middleware.rateLimit.burst }}
