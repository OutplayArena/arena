apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blotto.fullname" . }}-db
  labels:
    {{- include "blotto.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "blotto.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "blotto.database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blotto.database.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.database.image }}
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blotto.fullname" . }}-db
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.database.database }}
            - name: POSTGRES_HOST_AUTH_METHOD
              value: md5
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.database.storage }}
