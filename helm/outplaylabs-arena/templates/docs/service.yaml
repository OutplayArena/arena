apiVersion: v1
kind: Service
metadata:
  name: {{ include "outplaylabs-arena.fullname" . }}-docs
  labels:
    {{- include "outplaylabs-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "outplaylabs-arena.docs.selectorLabels" . | nindent 4 }}
