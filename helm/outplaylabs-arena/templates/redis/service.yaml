apiVersion: v1
kind: Service
metadata:
  name: {{ include "outplaylabs-arena.fullname" . }}-redis
  labels:
    {{- include "outplaylabs-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "outplaylabs-arena.redis.selectorLabels" . | nindent 4 }}
