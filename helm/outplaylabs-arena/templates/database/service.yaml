apiVersion: v1
kind: Service
metadata:
  name: {{ include "outplaylabs-arena.fullname" . }}-db
  labels:
    {{- include "outplaylabs-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "outplaylabs-arena.database.selectorLabels" . | nindent 4 }}
