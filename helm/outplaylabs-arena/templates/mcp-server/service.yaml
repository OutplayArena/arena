apiVersion: v1
kind: Service
metadata:
  name: {{ include "outplaylabs-arena.fullname" . }}-mcp
  labels:
    {{- include "outplaylabs-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    {{- include "outplaylabs-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: {{ .Values.mcpServer.port }}
      targetPort: http
      protocol: TCP
