server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Health check — Traefik and Docker HEALTHCHECK use this
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # MkDocs generates a directory per page; try the file, then the
    # directory index, then the bare .html extension before falling to 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Use MkDocs' own styled 404 page
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Gzip text assets
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # Long-lived cache for fingerprinted static assets (MkDocs hashes filenames)
    location ~* \.(css|js|woff2?|ttf|png|jpg|jpeg|gif|ico|svg)$ {
        expires     30d;
        add_header  Cache-Control "public, immutable";
    }
}
