<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OutplayArena - Strategic Game Theory Platform</title>
    <link rel="icon" type="image/png" href="/img/favicon_outplayarena.png" />
    <link rel="apple-touch-icon" href="/img/favicon_outplayarena.png" />
    <script>
      (function() {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
